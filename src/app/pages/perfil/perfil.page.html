<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mis datos </ion-title> <ion-buttons slot="end">
      <ion-chip>
        <ion-avatar>
          <img alt="user" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
        </ion-avatar>
        <ion-label>nombre de usuario</ion-label>
      </ion-chip>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title>Mis datos personales</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true">
    <ion-header collapse="condense">
      <ion-toolbar>
        <ion-title size="large">Editar Perfil</ion-title>
      </ion-toolbar>
    </ion-header>


    <div class="contenedor-lista">
      <ion-list lines="full" class="lista-perfil">
        <ion-item>
          <ion-input label="Nombre" label-placement="floating" placeholder="Tu nombre"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Apellido" label-placement="floating" placeholder="Tu apellido"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Correo Electrónico" label-placement="floating" type="email"
            placeholder="email@ejemplo.com"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Teléfono (Opcional)" label-placement="floating" type="tel"
            placeholder="+54 9 11 1234 5678"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Fecha de Nacimiento" label-placement="floating" type="date"
            placeholder="DD/MM/AAAA"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label>Documentación Fotográfica</ion-label>
          <div class="file-upload-container">
            <input type="file" accept="image/*" id="fileInput" (change)="actualizarNombreArchivo($event)" />
            <label for="fileInput" class="file-button">Elegir archivo</label>
            <span class="file-name">{{ nombreArchivo }}</span>
          </div>
        </ion-item>

      </ion-list>

      <div class="ion-padding">
        <ion-button expand="block" class="btnGuardar">Guardar Cambios</ion-button>
      </div>
    </div>
  </ion-content>
